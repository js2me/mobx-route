name: Builds, tests & co

on:
  - push
  - pull_request

permissions: read-all

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        node-version: [24]
        mobx-version: ['^6.13.3', '^7.0.0']
        include:
          - mobx-version: '^6.13.3'
            mobx-react-lite-version: '^4.0.7'
          - mobx-version: '^7.0.0'
            mobx-react-lite-version: '^5.0.0'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tree
        uses: actions/checkout@v4

      - name: Set-up Node.js
        uses: actions/setup-node@v4
        with:
          check-latest: true
          node-version: ${{ matrix.node-version }}

      - run: corepack enable

      - run: pnpm add --workspace-root --save-dev --save-exact mobx@${{ matrix.mobx-version }} mobx-react-lite@${{ matrix.mobx-react-lite-version }}

      - run: pnpm check

      - run: pnpm build

      - run: pnpm docs:build

      - run: pnpm test:coverage
