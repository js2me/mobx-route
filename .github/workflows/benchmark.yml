name: Benchmark

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install base dependencies
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/benchmark-base" "$BASE_SHA"
          pnpm --dir "$RUNNER_TEMP/benchmark-base" install --frozen-lockfile

      - name: Run benchmark
        run: |
          for run in 1 2 3; do
            if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
              pnpm --dir "$RUNNER_TEMP/benchmark-base" run profile:bench --outputJson="$RUNNER_TEMP/benchmark-base-$run.json"
            fi
            pnpm run profile:bench --outputJson="$RUNNER_TEMP/benchmark-head-$run.json"
          done

      - name: Check for regressions
        run: |
          baseline=benchmark-baseline.json
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            baseline="$RUNNER_TEMP/benchmark-baseline.json"
            node scripts/update-benchmark-baseline.mjs --output "$baseline" "$RUNNER_TEMP"/benchmark-base-{1,2,3}.json
          fi
          node scripts/check-benchmark.mjs "$baseline" "$RUNNER_TEMP"/benchmark-head-{1,2,3}.json
